<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNB · Gestión familiar — Demo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--navy-900:#081120;--navy-800:#0d1b33;--navy-700:#132647;--navy-600:#172b4d;--navy-500:#2c4673;--navy-400:#5b7096;--navy-300:#8d9db8;--navy-200:#c4cddb;--navy-100:#e4e9f1;--navy-50:#f1f4f8;
--gold-800:#6b540b;--gold-700:#8a6d0f;--gold-600:#a8861a;--gold-500:#c9a227;--gold-400:#d4af37;--gold-300:#e5c358;--gold-100:#f8efcc;--gold-50:#fcf8e8;
--cream:#fbf7ee;--cream-2:#f3ece0;--cream-line:#efe6d3;--white:#fff;--line:#dde3ec;--line-strong:#b9c4d4;
--fg-1:#0d1b33;--fg-2:#3b4d66;--fg-3:#5a6b84;--on-1:#f2f6fb;--on-2:#b9c6da;--on-3:#8496b1;
--ok:#17785a;--ok-bg:#d3f1e5;--ok-50:#ecf9f3;--ok-t:#0d5a42;
--warn:#b4570f;--warn-bg:#fbe3c8;--warn-50:#fef5ea;
--bad:#b3321f;--bad-bg:#f7d6d0;--bad-50:#fdf0ee;--bad-t:#8a2415;
--info:#2a63a8;--info-bg:#d6e5f6;--info-50:#eef5fc;
--sh-sm:0 4px 14px -4px rgba(13,27,51,.10);--sh-md:0 12px 30px -8px rgba(13,27,51,.16);--sh-lg:0 24px 48px -12px rgba(13,27,51,.24);--sh-gold:0 8px 24px -6px rgba(201,162,39,.5);
--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--fg-2);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;color:var(--fg-1);letter-spacing:-.015em}
a{color:var(--gold-700)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}.ic.l{width:30px;height:30px}
:focus-visible{outline:3px solid var(--gold-500);outline-offset:2px}

/* proto bar */
.pbar{background:var(--navy-900);color:var(--on-2);font-size:13px;display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.pbar b{color:var(--gold-500);letter-spacing:.12em;font-size:11px}
.pbar .sp{flex:1}
.pbar select{background:var(--navy-700);color:var(--on-1);border:1px solid var(--navy-500);border-radius:999px;padding:5px 10px;font-size:13px}
.pbar button{background:transparent;color:var(--on-2);border:1px solid var(--navy-500);border-radius:999px;padding:5px 12px;font-size:13px}
.pbar button:hover{background:var(--navy-700)}

/* layout */
.app{display:flex;min-height:calc(100vh - 44px)}
.side{display:none}
main{flex:1;min-width:0;padding-bottom:120px}
.wrap{padding:0 16px}
@media(min-width:960px){
 .side{display:flex;flex-direction:column;gap:6px;width:250px;flex:none;background:var(--navy-800);padding:22px 14px;position:sticky;top:0;height:100vh}
 .side .brand{color:var(--on-1);padding:4px 12px 20px}
 .side .brand span{display:block;font-size:11px;letter-spacing:.14em;color:var(--gold-500);font-weight:700}
 .side .brand b{font-size:19px;font-weight:800}
 .side nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--on-2);font-weight:600;font-size:16px;border-radius:14px;padding:12px 14px;text-align:left}
 .side nav button:hover{background:var(--navy-700)}
 .side nav button.on{background:var(--navy-600);color:var(--gold-500)}
 .side .add{margin-top:14px}
 .side .me{margin-top:auto;display:flex;gap:10px;align-items:center;color:var(--on-1);padding:10px;border-top:1px solid var(--navy-600)}
 .side .me small{display:block;color:var(--on-3);font-size:12px}
 main{padding-bottom:60px}
 .wrap{padding:0 36px;max-width:1180px}
 .tabbar{display:none!important}
}

/* hero */
.hero{background:var(--navy-800);color:var(--on-2);padding:24px 20px 62px;border-radius:0 0 32px 32px}
.hero .top{display:flex;justify-content:space-between;align-items:center}
.eb{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-500)}
.eb.dk{color:var(--gold-700)}
.hero h1{color:var(--on-1);font-size:31px;line-height:1.2;font-weight:800;letter-spacing:-.025em;margin:14px 0 18px;max-width:640px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:560px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:14px;color:var(--on-2);font-size:11px;font-weight:600;border:0;background:none}
.wd b{font-size:18px;color:var(--on-1)}
.wd i{width:7px;height:7px;border-radius:50%;display:block}
.wd.on{background:var(--gold-500);color:var(--navy-800)}.wd.on b{color:var(--navy-800)}
.lift{margin-top:-42px;position:relative}
@media(min-width:960px){.hero{padding:30px 36px 70px;border-radius:0 0 36px 36px}.hero h1{font-size:38px}}

.av{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.av.rg{border:2px solid var(--gold-500);color:var(--gold-500)}
.av.sm{width:34px;height:34px;font-size:12px}
.av.lg{width:64px;height:64px;font-size:19px}
.tile{width:60px;height:60px;border-radius:19px;display:grid;place-items:center;flex:none;font-weight:800;font-size:18px}
.tile.sm{width:48px;height:48px;border-radius:15px;font-size:15px}

/* cards */
.card{background:var(--white);border-radius:24px;padding:20px;box-shadow:var(--sh-sm)}
.card.hi{box-shadow:var(--sh-lg)}
.card.alert{border:2px solid var(--bad-bg)}
.shd{display:flex;align-items:center;gap:10px;margin:26px 4px 12px}
.shd h2{font-size:20px;font-weight:800}
.shd .dot{width:10px;height:10px;border-radius:50%}
.shd .c{color:var(--fg-3);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.task{display:flex;gap:14px;align-items:center;background:var(--white);border-radius:22px;padding:14px;box-shadow:var(--sh-sm);border:1px solid transparent;width:100%;text-align:left}
.task.click{cursor:pointer}
.task.click:hover{box-shadow:var(--sh-md);border-color:var(--gold-300)}
.task .tx{flex:1;min-width:0}
.task .t{font-size:18px;font-weight:700;color:var(--fg-1);line-height:1.3}
.task .m{font-size:15px;font-weight:600}
.task .s{font-size:14px;color:var(--fg-3)}
.task.deleg{background:var(--cream-2);box-shadow:none}
.chk{width:58px;height:58px;border-radius:50%;border:2px solid var(--line-strong);background:var(--white);color:var(--fg-1);display:grid;place-items:center;flex:none;transition:all .14s var(--ease)}
.chk:hover{border-color:var(--gold-500);background:var(--gold-50)}
.main-task{display:flex;flex-direction:column;gap:16px}
.main-task .row{display:flex;gap:14px;align-items:center}
.main-task h3{font-size:23px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad-t)}.pill.warn{background:var(--warn-bg);color:#8a420a}.pill.ok{background:var(--ok-bg);color:var(--ok-t)}.pill.neu{background:var(--navy-100);color:var(--navy-700)}.pill.gold{background:var(--gold-100);color:var(--gold-800)}.pill.info{background:var(--info-bg);color:#1d4c84}
.pill.prop{background:var(--gold-100);color:var(--gold-800);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:17px;height:56px;padding:0 24px;transition:all .14s var(--ease);white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--gold-500);color:var(--navy-800);box-shadow:var(--sh-gold)}
.btn.pri:hover{background:var(--gold-400)}
.btn.sec{background:var(--white);color:var(--navy-800);border-color:var(--navy-800)}
.btn.sec:hover{background:var(--navy-50)}
.btn.gh{background:var(--white);color:var(--fg-1);border:1px solid var(--line-strong)}
.btn.gh:hover{background:var(--navy-50)}
.btn.big{height:64px;font-size:19px;font-weight:800}
.btn.sm{height:44px;font-size:15px;padding:0 18px}
.btn.full{width:100%}
.btn.dark{background:var(--navy-800);color:var(--on-1)}
.lnk{background:none;border:0;color:var(--gold-700);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0;font-size:15px}
.banner{border-radius:16px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--info-50);color:#1d4c84}
.banner.warn{background:var(--warn-50);color:#8a420a}
.banner.bad{background:var(--bad-50);color:var(--bad-t)}
.banner.ok{background:var(--ok-50);color:var(--ok-t)}

/* grids */
.cols{display:grid;gap:20px}
@media(min-width:960px){.cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.fam{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.famb{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--fg-1);font-weight:600;font-size:15px;position:relative}
.famb .av{width:64px;height:64px;font-size:19px}
.famb .badge{position:absolute;top:0;right:calc(50% - 34px);width:16px;height:16px;border-radius:50%;background:var(--bad);border:3px solid var(--cream)}
.ents{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:960px){.ents{grid-template-columns:repeat(4,1fr)}}
.ent{background:var(--white);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh-md);border:2px solid transparent;text-align:left}
.ent:hover{border-color:var(--gold-300)}
.ent.al{border-color:var(--bad-bg)}
.ent b{font-size:17px;color:var(--fg-1)}
.ent span{font-size:14px;font-weight:600}

/* ring */
.ringw{display:flex;gap:18px;align-items:center}
.ring{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:84px;height:84px;border-radius:50%;background:var(--navy-800);display:flex;flex-direction:column;align-items:center;justify-content:center}
@media(max-width:959px){.ringw h1{font-size:24px!important}.ring{width:92px;height:92px}.ring>div{width:72px;height:72px}}
.ring b{font-size:28px;font-weight:300;color:var(--on-1);line-height:1.1}
.ring small{font-size:11px;color:var(--on-2)}

/* feed */
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:14px}
.fi .rail{display:flex;flex-direction:column;align-items:center}
.fi .rail i{width:14px;height:14px;border-radius:50%;background:var(--line-strong);margin-top:5px;display:block}
.fi .rail i.k{background:var(--gold-500)}
.fi .rail span{width:2px;flex:1;background:var(--line)}
.fi .bd{padding-bottom:18px;flex:1;min-width:0}
.fi .fx{font-size:16px;color:var(--fg-1)}
.fi .fw{font-size:14px;color:var(--fg-3);margin-top:2px}
.fi .acts{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}

/* calendar */
.cal{display:none}
.agenda{display:block}
@media(min-width:960px){.cal{display:grid}.agenda{display:none}}
.cal{grid-template-columns:repeat(7,1fr);background:var(--white);border-radius:24px;overflow:hidden;box-shadow:var(--sh-sm)}
.cal .dw{background:var(--navy-800);color:var(--on-2);font-size:12px;font-weight:700;letter-spacing:.1em;padding:10px;text-transform:uppercase}
.cal .dc{min-height:112px;border-right:1px solid var(--cream-line);border-bottom:1px solid var(--cream-line);padding:6px;display:flex;flex-direction:column;gap:4px}
.cal .dc:nth-child(7n){border-right:0}
.cal .dc.out{background:var(--cream)}
.cal .n{font-size:13px;font-weight:700;color:var(--fg-3);padding:2px 6px}
.cal .today .n{background:var(--gold-500);color:var(--navy-800);border-radius:999px;align-self:flex-start}
.ce{border:0;border-radius:8px;padding:4px 7px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce.closed{text-decoration:line-through;opacity:.7}
.mnav{display:flex;align-items:center;gap:10px}
.mnav h2{min-width:170px;text-align:center;font-size:20px}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);background:var(--white);display:grid;place-items:center;color:var(--fg-1)}
.ib:disabled{opacity:.35}
.dayh{font-size:15px;font-weight:700;color:var(--fg-3);margin:18px 4px 8px}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--white);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;color:var(--fg-2);display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--navy-800);border-color:var(--navy-800);color:var(--on-1)}
.chip .dt{width:10px;height:10px;border-radius:50%}

/* docs */
.doc{display:flex;gap:14px;align-items:center;background:var(--white);border-radius:20px;padding:14px;box-shadow:var(--sh-sm)}
.docic{width:48px;height:58px;border-radius:10px;background:var(--navy-50);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--navy-500);flex:none}
.dgrid{display:grid;gap:10px}
@media(min-width:960px){.dgrid{grid-template-columns:repeat(2,1fr)}}

/* radial */
.radial{display:none;position:relative;height:520px}
@media(min-width:960px){.radial{display:block}.rlist{display:none}}
.radial>svg{position:absolute;inset:0;width:100%;height:100%}
.radial line{stroke:var(--navy-200);stroke-width:1.5;vector-effect:non-scaling-stroke}
.rc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:170px;height:170px;border-radius:50%;background:var(--navy-800);border:4px solid var(--gold-500);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-1);text-align:center;box-shadow:var(--sh-lg)}
.rc b{font-size:18px}.rc small{color:var(--on-2);font-size:13px}
.rn{position:absolute;transform:translate(-50%,-50%);width:220px;background:var(--white);border:2px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;box-shadow:var(--sh-sm)}
.rn:hover{box-shadow:var(--sh-md)}
.rn b{display:block;color:var(--fg-1);font-size:15px;line-height:1.3}
.rn small{font-size:13px;color:var(--fg-3)}
.rn.bad{background:var(--bad-50);border-color:#e4a79c}.rn.warn{background:var(--warn-50);border-color:#f1c18f}.rn.ok{background:var(--ok-50);border-color:#9fd8c0}

/* tabbar */
.tabbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:40;background:var(--navy-800);border-radius:999px;padding:7px;display:flex;align-items:center;gap:4px;box-shadow:var(--sh-lg)}
.tabbar button{flex:1;height:54px;border:0;border-radius:999px;background:transparent;color:var(--on-2);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabbar button .ic{width:22px;height:22px}
.tabbar button.on{background:var(--navy-600);color:var(--gold-500)}
.tabbar .plus{flex:none;width:58px;height:58px;border-radius:50%;background:var(--gold-500);color:var(--navy-800)}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(8,17,32,.6);display:flex;align-items:flex-end;justify-content:center;animation:fd .24s var(--ease)}
.sheet{background:var(--white);width:100%;max-width:560px;max-height:96vh;overflow:auto;border-radius:28px 28px 0 0;animation:up .3s var(--ease)}
@media(min-width:700px){.scrim{align-items:center;padding:24px}.sheet{border-radius:28px}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 0}
.sheet .sb{padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.x{width:48px;height:48px;border-radius:50%;border:0;background:var(--navy-50);color:var(--fg-1);display:grid;place-items:center;flex:none}
.viewer{background:var(--navy-900);border-radius:22px;min-height:230px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;position:relative}
.viewer .frame{position:absolute;inset:18px 40px;border:3px dashed var(--navy-500);border-radius:22px}
.receipt{width:190px;background:#fff;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:7px;transform:rotate(-2deg);box-shadow:0 24px 48px -12px rgba(0,0,0,.6);position:relative}
.receipt i{display:block;height:6px;border-radius:3px;background:var(--line)}
.receipt i.h{height:11px;width:55%;background:var(--navy-800)}
.stamp{align-self:flex-end;border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;letter-spacing:.1em;transform:rotate(-6deg)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fld label,.lbl{display:block;font-weight:700;color:var(--fg-1);font-size:16px;margin-bottom:8px}
.inp{width:100%;height:56px;border-radius:16px;border:1px solid var(--line-strong);padding:0 16px;font-size:17px;color:var(--fg-1);background:var(--white)}
textarea.inp{height:90px;padding:14px 16px;resize:vertical}
.inp:focus{outline:3px solid var(--gold-500);border-color:var(--gold-500)}
.inp.err{border-color:var(--bad)}
.er{color:var(--bad);font-size:15px;font-weight:600;margin-top:6px}
.help{font-size:14px;color:var(--fg-3);margin-top:6px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:24px 8px}
.done .big{width:96px;height:96px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.done .big .ic{width:52px;height:52px;stroke-width:2.25}
.rec{display:flex;align-items:center;gap:10px;background:var(--gold-50);border:1px solid var(--gold-100);border-radius:16px;padding:12px 14px;font-size:15px;color:var(--gold-800);font-weight:600}
.rec .wave{flex:1;height:22px;background:repeating-linear-gradient(90deg,var(--gold-500) 0 3px,transparent 3px 7px);opacity:.6;border-radius:4px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;background:var(--navy-800);color:var(--on-1);padding:14px 20px;border-radius:18px;font-size:15px;box-shadow:var(--sh-lg);display:flex;gap:10px;align-items:center;max-width:92vw;animation:fd .24s var(--ease)}
.toast .ic{color:var(--gold-500)}
@media(min-width:960px){.toast{bottom:32px}}
.empty{text-align:center;background:var(--white);border-radius:24px;padding:36px 20px;box-shadow:var(--sh-sm)}
.empty .big{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.empty h3{font-size:21px}
.empty p{color:var(--fg-3);margin:6px auto 0;max-width:360px}
.ph{padding-top:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ph h1{font-size:30px;font-weight:800;letter-spacing:-.025em;margin-top:4px}
.ph p{margin:4px 0 0;color:var(--fg-3)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--fg-3);font-weight:700;font-size:16px;padding:18px 0 0}
.muted{color:var(--fg-3);font-size:15px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--white);border-radius:20px;overflow:hidden;box-shadow:var(--sh-sm);font-size:15px}
.tbl th{background:var(--navy-800);color:var(--on-2);text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:12px 16px}
.tbl td{padding:14px 16px;border-top:1px solid var(--cream-line);vertical-align:top}
@keyframes fd{from{opacity:0}}

function seesEnt(eid,u=S.user){const p=P[u];if(p.kind!=='cuidador')return true;return (p.scope||[]).includes(eid)}

function seesDoc(d,u=S.user){if(!seesEnt(d.ent,u))return false;if(isCare(u)){if(['Identidad','Propiedad'].includes(d.cat))return false;if(d.cat==='Salud'&&!P[u].salud)return false}return true}
function canReport(i,u=S.user){if(!i.open)return false;if(isAppt(i)&&days(i.due)>0)return false;const k=P[u].kind;if(k==='casa')return i.resp==='luis'||i.resp==='lucero';if(k==='cuidador')return seesItem(i,u)&&(i.resp==='luis'||i.resp==='lucero'||i.resp===u);return i.resp===u}
function collectA(m){document.querySelectorAll('[id^=a_]').forEach(x=>m.f[x.id.slice(2)]=x.value.trim())}
function fmtTime(h){const[H,M]=h.split(':').map(Number);const ap=H>=12?'p. m.':'a. m.';return `${H%12||12}:${String(M).padStart(2,'0')} ${ap}`}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const canEdit=()=>!isCare();
const kebab=(k,id,lab)=>canEdit()?`<button class="kebab" data-a="kebab" data-k="${k}" data-id="${id}" aria-label="Más opciones de ${esc(lab)}">${ic('kebab')}</button>`:'';
function menuHtml(){const m=S.menu;if(!m)return '';
 const opts={ent:[['m-edit-ent','edit','Editar datos'],isAdmin()?['m-del-ent','trash','Eliminar']:null],item:[['m-edit-item','edit','Editar'],['m-del-item','trash','Eliminar']],doc:[['m-edit-doc','edit','Editar'],(!catSens(S.docs.find(d=>d.id===m.id)?.cat)||isAdmin())?['m-del-doc','trash','Eliminar']:null]}[m.k].filter(Boolean);
 const w=220,h=opts.length*48+12;let x=Math.min(m.r-w,innerWidth-w-8);x=Math.max(8,x);let y=m.b+6;if(y+h>innerHeight-8)y=m.t-h-6;
 return `<div class="menu" style="left:${x}px;top:${y}px" role="menu">${opts.map(o=>`<button role="menuitem" class="${o[0].includes('del')?'del':''}" data-a="${o[0]}" data-id="${m.id}">${ic(o[1],'s')}${o[2]}</button>`).join('')}</div>`}
function nav(v,a=null,push=true){if(push)S.stack.push([S.view,S.arg]);S.view=v;S.arg=a;S.modal=null;render();scrollTo(0,0)}
function back(){const p=S.stack.pop();if(p){S.view=p[0];S.arg=p[1]}else{S.view='home';S.arg=null}render();scrollTo(0,0)}
function toast(t){S.toast=t;render();clearTimeout(window._t);window._t=setTimeout(()=>{S.toast=null;render()},3600)}
function nowS(){const n=new Date();let h=n.getHours(),m=String(n.getMinutes()).padStart(2,'0');const ap=h>=12?'p. m.':'a. m.';h=h%12||12;return `Hoy · ${h}:${m} ${ap}`}
function addFeed(x,id,kind){S.feed.unshift({at:'Ahora',who:S.user,x,id,kind})}
function avisos(){
 const out=[];const u=S.user;
 S.items.filter(i=>i.open&&seesItem(i)&&stat(i)==='bad'&&(i.resp===u||canReport(i)||remote())).forEach(i=>out.push({ic:'alert',c:'var(--bad)',x:`${i.title}: ${statTxt(i).toLowerCase()}`,id:i.id}));
 S.items.filter(i=>i.open&&isAppt(i)&&seesItem(i)&&days(i.due)>=0&&days(i.due)<=7).forEach(i=>{const n=days(i.due);out.push({ic:'cal',c:'var(--info)',x:`${n===0?'Hoy':n===1?'Mañana':'Faltan '+n+' días'}: ${i.title} de ${ENT[i.ent].name}${i.time?' · '+i.time:''}${PL(i)?' · '+PL(i).name:''}`,id:i.id})});
 S.items.filter(i=>i.open&&i.reopened&&canReport(i)).forEach(i=>out.push({ic:'msg',c:'var(--warn)',x:`${P[i.reopened.by].short} pidió revisar: ${i.title}`,id:i.id}));
 S.feed.filter(f=>f.who!==u&&IT(f.id)&&seesItem(IT(f.id))).slice(0,3).forEach(f=>out.push({ic:'info',c:'var(--info)',x:`${P[f.who].short} ${f.x}`,id:f.id,at:f.at}));
 return out}

function taskRow(i,{showWho=true}={}){
 const st=stat(i),deleg=i.open&&P[i.resp].kind==='afuera'&&!remote();
 const can=canReport(i);
 const whoLine=isAppt(i)&&i.open?`<div class="s">${PL(i)?esc(PL(i).name):''}${i.time&&days(i.due)>1?' · '+fday(i.due).toLowerCase()+' '+i.time:''}${i.acomp?' · acompaña '+P[i.acomp].short:''}</div>`:i.resp!==S.user?`<div class="s">${i.open?'Lo hace '+P[i.resp].short:'Lo hizo '+P[i.closed.by].short}</div>`:(i.prep?`<div class="s">${esc(i.prep)}</div>`:'');
 return `<div class="task click ${deleg?'deleg':''}" data-a="open" data-id="${i.id}" role="button" tabindex="0">
 ${entTile(i.ent,'sm')}
 <div class="tx"><div class="t">${esc(i.title)}</div><div class="m" style="color:${statColor[st]}">${statTxt(i)}${i.time&&i.open&&!isAppt(i)?' · '+i.time:''}${i.reopened&&i.open?' · revisar':''}</div>${showWho?whoLine:''}</div>
 ${can?`<button class="chk" data-a="report" data-id="${i.id}" aria-label="${actLabel(i)}">${ic('check','l')}</button>`:(!i.open?`<span class="chk" style="background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)">${ic('check','l')}</span>`:'')}
 </div>`}
function weekStrip(list){
 const out=[];for(let k=0;k<7;k++){const d=new Date(2026,10,15+k);const its=list.filter(i=>i.open&&i.due.toDateString()===d.toDateString());
  const late=k===0&&list.some(i=>stat(i)==='bad');
  const col=late?'#e4806f':its.length?'#f1c18f':'transparent';
  out.push(`<button class="wd ${k===0?'on':''}" data-a="nav" data-v="cal"><span>${['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][d.getDay()]}</span><b>${d.getDate()}</b><i style="background:${col}"></i></button>`)}
 return `<div class="week">${out.join('')}</div>`}
function heroTools(){const n=avisos().length;return `<div class="htools"><button class="bell" data-a="avisos" aria-label="Avisos">${ic('bell')}${n?`<span class="n">${n}</span>`:''}</button><button class="av rg pic" data-a="nav" data-v="set" aria-label="Ajustes">${photoOf(S.user)?imgTag(photoOf(S.user)):portrait(S.user,'#e4e9f1')}</button></div>`}

/* ============ vistas ============ */
function countdown(){const ap=S.items.filter(i=>i.open&&isAppt(i)&&seesItem(i)&&days(i.due)>=0&&days(i.due)<=14).sort((a,b)=>a.due-b.due);
 if(!ap.length)return '';
 return `<div class="shd"><span class="dot" style="background:var(--info)"></span><h2>Citas y exámenes</h2><span class="c">${ap.length}</span></div><div class="cds">${ap.map(i=>{const n=days(i.due);return `<button class="cd" data-a="open" data-id="${i.id}"><div class="cdn"><b>${n===0?'Hoy':n===1?'1':n}</b><small>${n===0?(i.time||''):n===1?'día':'días'}</small></div><div class="cdt">${entTile(i.ent,'sm')}<div><div class="t">${esc(i.title)}</div><div class="s">${ENT[i.ent].name} · ${fday(i.due)}${i.time?', '+i.time:''}</div>${PL(i)?`<div class="s">${esc(PL(i).name)}</div>`:''}${i.ayunas?'<span class="pill warn" style="margin-top:4px">En ayunas</span>':''}</div></div></button>`}).join('')}</div>`}
function vHomeLocal(){
 const u=me();

 const late=mine.filter(i=>stat(i)==='bad');
 const week=mine.filter(i=>stat(i)==='warn');
 const later=mine.filter(i=>stat(i)==='neu');
 const deleg=care?[]:S.items.filter(i=>i.open&&P[i.resp].kind==='afuera'&&days(i.due)<=14);

 const rest=[...late,...week].filter(i=>i!==first&&!upA(i));
 const head=first?(isAppt(first)&&days(first.due)<0?`${u.short}, falta contar cómo fue: ${first.title.toLowerCase()}`:`${u.short}, ${stat(first)==='bad'?'hoy toca':'lo próximo es'}: ${first.title.toLowerCase()}`):`Todo al día, ${u.short}`;
 const mainCard=first?`<div class="card hi main-task">

 ${later.filter(i=>!(upA(i)&&days(i.due)<=14)).length?`<div class="shd"><h2>Más adelante</h2><span class="c">${later.filter(i=>!(upA(i)&&days(i.due)<=14)).length}</span></div><div class="stack">${later.filter(i=>!(upA(i)&&days(i.due)<=14)).map(i=>taskRow(i)).join('')}</div>`:''}
 </div><div>

 </div></div></div>`;
}

 ${it?`<div class="acts"><button class="lnk" data-a="open" data-id="${it.id}">Ver</button>${canRe?`<button class="lnk" data-a="reopen" data-id="${it.id}">Pedir revisar</button>`:''}</div>`:''}</div></div>`}).join('')}</div>`}
function vHomeRemote(){

  return `<button class="ent ${l.length?'al':''}" data-a="ent" data-id="${e.id}">${entTile(e.id,'sm')}<b>${e.name}</b>${txt}</button>`}).join('');
 return `<section class="hero" style="padding-bottom:28px"><div class="top"><span class="eb">Casa de la familia · en Cali son las 12:47 p. m.</span>${heroTools()}</div>

 case 'invite':S.modal={k:'invite',role:'cuidador',scope:['luis','lucero'],salud:true};render();break;
 case 'scope':{m.n=val('iname');m.c=val('icontact');const s=new Set(m.scope||[]);s.has(t.dataset.v)?s.delete(t.dataset.v):s.add(t.dataset.v);m.scope=[...s];render();break}
 case 'isalud':m.n=val('iname');m.c=val('icontact');m.salud=!m.salud;render();break;
 case 'doinvite':{m.n=val('iname');m.c=val('icontact');const er={};if(!m.n)er.n=1;if(!/^\S+@\S+\.\S+$/.test(m.c)&&!/^\d{10}$/.test(m.c.replace(/\s/g,'')))er.c=1;if(!m.role)er.role=1;if(m.role==='cuidador'&&!(m.scope||[]).length)er.scope=1;if(Object.keys(er).length){m.err=er;render();break}
  const id='u'+Date.now(),parts=m.n.split(/\s+/);P[id]={id,name:m.n,short:parts[0],ini:(parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase(),kind:m.role==='cuidador'?'cuidador':m.role==='admin'?'afuera':'casa',role:m.role,where:'—',bg:'#e4e9f1',fg:'#132647',status:'pendiente',contact:m.c,scope:m.scope,salud:m.salud};
  S.modal=null;render();toast('Invitación enviada a '+m.c+' (simulado)');break}
 case 'accept':{const p=P[t.dataset.u];p.status='activo';S.font[p.id]='grande';render();toast(p.short+' aceptó. Ya aparece en “Ver como”');break}
 case 'remove':S.modal={k:'remove',u:t.dataset.u};render();break;
 case 'doremove':{const u=m.u;if(P[u].role==='admin'&&adminsLeft(u,'x')<1){m.err='Debe quedar al menos un administrador.';render();break}
  const name=P[u].short;S.items.forEach(i=>{if(i.open&&i.resp===u)i.resp='luis'});delete P[u];S.modal=null;render();toast('Se quitó el acceso a '+name);break}
 case 'addent':S.modal={k:'addent'};render();break;
 case 'doaddent':{m.n=val('ename');const er={};if(!m.n)er.n=1;if(!m.type)er.type=1;if(Object.keys(er).length){m.err=er;render();break}
  const id='e'+Date.now();ENT[id]={id,name:m.n.split(' ')[0],full:m.n,type:m.type,ini:m.n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(),bg:'#e4e9f1',fg:'#2c4673'};S.modal=null;render();toast(m.n+' agregado a la familia');break}
 }
});
render();
</script>
